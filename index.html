<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動中心及全民運動館低碳管理系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for parsing JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  <!-- React App 將會掛載到這裡 -->
  <div id="root"></div>

  <!-- 使用 text/babel 並指定 module 以支援 ES 模組匯入 (Firebase v11) -->
  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPP9x3aYxgBz51CRRu7AseEVBLGqztpD8",
      authDomain: "a01-low-carbon-management.firebaseapp.com",
      projectId: "a01-low-carbon-management",
      storageBucket: "a01-low-carbon-management.firebasestorage.app",
      messagingSenderId: "90010133926",
      appId: "1:90010133926:web:784d755325c25d9af31b67",
      measurementId: "G-KKQ7J1VRTW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    // 在獨立環境中，若無系統注入的 __app_id，則使用預設字串以避免寫入路徑錯誤
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'standalone-1-90010133926-web';

    const MOCK_FACTORS = {
      ELECTRICITY: { factor: 0.494, unit: 'kg CO2e/kWh', name: '電力' },
      WATER: { factor: 0.156, unit: 'kg CO2e/度', name: '自來水' },
      NATURAL_GAS: { factor: 2.09, unit: 'kg CO2e/度', name: '天然氣' }
    };

    const IconDashboard = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>;
    const IconEdit = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>;
    const IconCheck = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
    const IconTrending = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>;
    const IconCrystal = () => <span className="text-xl mr-2">🔮</span>;
    const IconReport = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
    const IconSettings = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>;
    const IconUpload = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>;

    const Badge = ({ status }) => {
      const styles = {
        DRAFT: 'bg-slate-100 text-slate-700 border-slate-300',
        SUBMITTED: 'bg-amber-50 text-amber-700 border-amber-200',
        APPROVED: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        REJECTED: 'bg-rose-50 text-rose-700 border-rose-200'
      };
      const labels = { DRAFT: '草稿', SUBMITTED: '待審核', APPROVED: '已核准', REJECTED: '被退回' };
      return <span className={`px-2 py-0.5 rounded-full text-xs font-semibold border ${styles[status]}`}>{labels[status]}</span>;
    };

    const DashboardView = ({ activities }) => {
      const approvedActivities = activities.filter(a => a.status === 'APPROVED');
      const totalEmissions = approvedActivities.reduce((sum, a) => sum + (a.co2e || 0), 0);
      
      const categoryTotals = approvedActivities.reduce((acc, a) => {
        acc[a.category] = (acc[a.category] || 0) + a.co2e;
        return acc;
      }, {});

      const maxCategory = Math.max(...Object.values(categoryTotals), 1);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <p className="text-slate-500 text-sm font-semibold mb-1">年度累積碳排 (已核准)</p>
              <div className="flex items-baseline">
                <h2 className="text-3xl font-bold text-slate-900">{(totalEmissions / 1000).toFixed(2)}</h2>
                <span className="ml-2 text-slate-500">tCO2e</span>
              </div>
              <p className="text-xs text-emerald-600 mt-2 font-semibold">↑ 需核准數據後方可累計</p>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <p className="text-slate-500 text-sm font-semibold mb-1">盤查資料筆數</p>
              <div className="flex items-baseline">
                <h2 className="text-3xl font-bold text-slate-900">{activities.length}</h2>
                <span className="ml-2 text-slate-500">筆記錄</span>
              </div>
            </div>
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
              <p className="text-slate-500 text-sm font-semibold mb-1">待辦事項</p>
              <h2 className="text-3xl font-bold text-amber-600">
                {activities.filter(a => a.status === 'SUBMITTED').length} 筆
              </h2>
              <span className="text-sm text-slate-500">待主管審核</span>
            </div>
          </div>

          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-lg font-bold text-slate-900 mb-4">排放熱點分析 (範疇二主力)</h3>
            {Object.keys(categoryTotals).length === 0 ? (
              <div className="text-slate-400 text-sm py-4">無已核准的盤查數據，請先完成數據填報並審核。</div>
            ) : (
              <div className="space-y-4">
                {Object.entries(categoryTotals).map(([cat, val]) => (
                  <div key={cat}>
                    <div className="flex justify-between text-sm mb-1">
                      <span className="font-semibold text-slate-700">{MOCK_FACTORS[cat]?.name || cat}</span>
                      <span className="text-slate-500 font-mono">{(val/1000).toFixed(2)} tCO2e ({(val/totalEmissions*100).toFixed(1)}%)</span>
                    </div>
                    <div className="w-full bg-slate-100 rounded-full h-2.5">
                      <div 
                        className="bg-emerald-500 h-2.5 rounded-full transition-all duration-500" 
                        style={{ width: `${(val / maxCategory) * 100}%` }}
                      ></div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    const DataEntryView = ({ onAddActivity }) => {
      const [entryMode, setEntryMode] = useState('manual');
      const [formData, setFormData] = useState({ month: '2026-04', category: 'ELECTRICITY', value: '' });
      const [isZeroConfirmed, setIsZeroConfirmed] = useState(false);
      const [error, setError] = useState(null);
      const [importStatus, setImportStatus] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError(null);

        if (formData.value === '' || formData.value === null) {
          setError("數值不得為空白。若尚未抄表請暫存草稿；若確認無耗用請輸入 0。");
          return;
        }

        const numericValue = Number(formData.value);
        if (numericValue === 0 && !isZeroConfirmed) {
          setError("系統偵測數值為 0。若本月確實無耗用，請勾選「確認本月無耗用」方可送審。");
          return;
        }

        if (numericValue > 500000) {
          setError("數值異常過高 (較同期波動 > 30%)，請重新確認小數點或退回補件。");
          return;
        }

        const factorData = MOCK_FACTORS[formData.category];
        const co2e = numericValue * factorData.factor;

        onAddActivity({
          id: Date.now().toString(),
          ...formData,
          value: numericValue,
          co2e,
          status: 'SUBMITTED',
          meter: '總表'
        });

        setFormData({ ...formData, value: '' });
        setIsZeroConfirmed(false);
        setError(null);
      };

      const handleFileUpload = (e) => {
        e.preventDefault();
        setImportStatus('processing');
        setTimeout(() => {
          setImportStatus('error');
        }, 1500);
      };

      return (
        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-2xl">
          <div className="flex justify-between items-center mb-6">
            <h3 className="text-lg font-bold text-slate-900">活動數據填報 (US-01, US-02)</h3>
            <div className="flex bg-slate-100 p-1 rounded-lg">
              <button onClick={() => setEntryMode('manual')} className={`px-3 py-1 text-sm font-semibold rounded-md transition-colors ${entryMode === 'manual' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>單筆手動</button>
              <button onClick={() => setEntryMode('batch')} className={`px-3 py-1 text-sm font-semibold rounded-md transition-colors ${entryMode === 'batch' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Excel 批次匯入</button>
            </div>
          </div>
          
          {entryMode === 'manual' ? (
            <>
              {error && (
                <div className="bg-rose-50 border-l-4 border-rose-500 p-4 mb-4 text-rose-700 text-sm font-semibold">
                  {error}
                </div>
              )}
              <form onSubmit={handleSubmit} className="space-y-4">
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">盤查月份</label>
                    <input type="month" value={formData.month} onChange={e => setFormData({...formData, month: e.target.value})} className="w-full p-2 border border-slate-300 rounded focus:ring-emerald-500 focus:border-emerald-500 outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-1">能源類別</label>
                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-2 border border-slate-300 rounded focus:ring-emerald-500 focus:border-emerald-500 outline-none">
                      {Object.entries(MOCK_FACTORS).map(([k, v]) => <option key={k} value={k}>{v.name}</option>)}
                    </select>
                  </div>
                </div>
                
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-1">活動數據 (耗用量)</label>
                  <div className="flex">
                    <input 
                      type="number" 
                      value={formData.value} 
                      onChange={e => {
                        setFormData({...formData, value: e.target.value});
                        if (e.target.value !== '0') setIsZeroConfirmed(false);
                      }} 
                      placeholder="請輸入精確數值..."
                      className="flex-1 p-2 border border-slate-300 rounded-l focus:ring-emerald-500 focus:border-emerald-500 outline-none" 
                    />
                    <span className="bg-slate-100 border border-l-0 border-slate-300 px-4 py-2 rounded-r text-slate-600">
                      {formData.category === 'ELECTRICITY' ? 'kWh' : '度'}
                    </span>
                  </div>
                </div>

                {formData.value === '0' && (
                  <div className="bg-amber-50 p-3 rounded border border-amber-200">
                    <label className="flex items-center space-x-2 text-sm text-amber-800">
                      <input type="checkbox" checked={isZeroConfirmed} onChange={e => setIsZeroConfirmed(e.target.checked)} className="rounded text-emerald-600 focus:ring-emerald-500" />
                      <span>確認本月確實無耗用 (如：停機、鍋爐停用)，非漏填。</span>
                    </label>
                  </div>
                )}

                <div className="pt-4 flex space-x-3">
                  <button type="button" className="px-4 py-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 font-semibold transition-colors">
                    暫存草稿
                  </button>
                  <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 font-semibold transition-colors">
                    送出審查
                  </button>
                </div>
              </form>
            </>
          ) : (
            <div className="space-y-4">
              <div className="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:bg-slate-50 transition-colors">
                <IconUpload className="mx-auto h-12 w-12 text-slate-400 mb-3" />
                <p className="text-sm font-semibold text-slate-700 mb-1">將 Excel 檔案拖曳至此，或點擊上傳</p>
                <p className="text-xs text-slate-500 mb-4">支援 .xlsx, .csv 格式 (上限 10MB)</p>
                <button onClick={handleFileUpload} className="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded shadow-sm hover:bg-slate-50 font-semibold text-sm transition-colors">
                  選擇檔案
                </button>
              </div>
              
              {importStatus === 'processing' && (
                <div className="bg-sky-50 text-sky-700 p-4 rounded-lg text-sm flex items-center font-semibold">
                  <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-sky-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                  資料解析與防呆檢核中...
                </div>
              )}
              
              {importStatus === 'error' && (
                <div className="bg-rose-50 border border-rose-200 rounded-lg p-4">
                  <h4 className="text-rose-800 font-bold text-sm mb-2 flex items-center">
                    <svg className="w-5 h-5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    匯入阻擋：發現 2 筆格式異常 (FR-06 錯誤攔截)
                  </h4>
                  <ul className="text-sm text-rose-600 space-y-1 ml-7 list-disc">
                    <li><span className="font-semibold">第 4 列</span>：數值欄位為空白，系統禁止預設為 0。請補齊數值或填 0 並勾選確認無耗用。</li>
                    <li><span className="font-semibold">第 12 列</span>：找不到對應的表計關聯 (MTR_WATER_UNKNOWN)。</li>
                  </ul>
                  <div className="mt-4">
                    <button onClick={() => setImportStatus(null)} className="text-sm bg-rose-100 text-rose-800 px-4 py-2 rounded hover:bg-rose-200 font-semibold transition-colors">重新上傳</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const ReviewView = ({ activities, onUpdateStatus }) => {
      const submitted = activities.filter(a => a.status === 'SUBMITTED').sort((a, b) => b.month.localeCompare(a.month));

      return (
        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-4xl">
          <h3 className="text-lg font-bold text-slate-900 mb-6">主管審核作業 (FR-11)</h3>
          {submitted.length === 0 ? (
            <div className="text-center py-12 bg-slate-50 border border-slate-200 border-dashed rounded-lg text-slate-500 font-semibold">
              目前無待審核的盤查數據，幹得好！
            </div>
          ) : (
            <div className="space-y-4">
              {submitted.map(act => (
                <div key={act.id} className="border border-slate-200 rounded-lg p-5 flex flex-col md:flex-row md:justify-between md:items-center bg-slate-50 hover:bg-slate-100 transition-colors">
                  <div className="mb-4 md:mb-0">
                    <div className="flex items-center space-x-3 mb-2">
                      <Badge status={act.status} />
                      <span className="font-bold text-slate-800 font-mono">{act.month}</span>
                      <span className="text-sm font-semibold text-slate-600">{MOCK_FACTORS[act.category]?.name || act.category}</span>
                    </div>
                    <div className="text-sm text-slate-600 flex flex-wrap gap-4">
                      <span>
                        填報數值: <span className="font-mono font-semibold text-slate-800">{act.value.toLocaleString()} {MOCK_FACTORS[act.category]?.unit.split('/')[1] || '單位'}</span>
                      </span>
                      <span>
                        換算碳排: <span className="font-mono font-bold text-emerald-600">{act.co2e.toLocaleString()} kgCO2e</span>
                      </span>
                    </div>
                  </div>
                  <div className="flex space-x-3">
                    <button onClick={() => onUpdateStatus(act.id, 'REJECTED')} className="px-4 py-2 text-sm bg-white border border-rose-200 text-rose-600 rounded shadow-sm hover:bg-rose-50 font-bold transition-colors">退回重編</button>
                    <button onClick={() => onUpdateStatus(act.id, 'APPROVED')} className="px-4 py-2 text-sm bg-emerald-600 border border-emerald-600 text-white rounded shadow-sm hover:bg-emerald-700 font-bold transition-colors">核准並鎖定</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const AbatementView = () => {
      const [form, setForm] = useState({ capex: 180000, savingsKwh: 42000, energyPrice: 3.8 });
      
      const annualSavingsTwd = form.savingsKwh * form.energyPrice;
      const paybackYears = form.capex / (annualSavingsTwd || 1);
      const co2eReduction = (form.savingsKwh * MOCK_FACTORS.ELECTRICITY.factor) / 1000;

      return (
        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-3xl">
          <h3 className="text-lg font-bold text-slate-900 mb-4">設備汰換 ROI 試算 (FR-14, US-04)</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-semibold text-slate-700 mb-1">預估資本支出 (CAPEX) - TWD</label>
                <input type="number" value={form.capex} onChange={e => setForm({...form, capex: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500" />
              </div>
              <div>
                <label className="block text-sm font-semibold text-slate-700 mb-1">預估年省電量 - kWh</label>
                <input type="number" value={form.savingsKwh} onChange={e => setForm({...form, savingsKwh: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500" />
              </div>
              <div>
                <label className="block text-sm font-semibold text-slate-700 mb-1">目前電價單價 (TWD/度)</label>
                <input type="number" step="0.1" value={form.energyPrice} onChange={e => setForm({...form, energyPrice: Number(e.target.value)})} className="w-full p-2 border border-slate-300 rounded outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500" />
              </div>
            </div>
            
            <div className="bg-slate-50 p-6 rounded-lg border border-slate-200 flex flex-col justify-center space-y-6">
              <div>
                <p className="text-slate-500 text-sm font-semibold">簡單回收年限 (Payback)</p>
                <p className="text-3xl font-bold text-teal-600">{paybackYears.toFixed(2)} <span className="text-lg text-slate-500 font-normal">年</span></p>
              </div>
              <div>

        e.preventDefault();
        setError(null);
        setIsLoading(true);
        try {
          if (isLogin) {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            await createUserWithEmailAndPassword(auth, email, password);
          }
        } catch (err) {
          if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
            setError("帳號或密碼錯誤，請重新輸入。");
          } else if (err.code === 'auth/email-already-in-use') {
            setError("此信箱已被註冊，請直接登入。");
          } else if (err.code === 'auth/weak-password') {
            setError("密碼強度不足，請至少輸入 6 個字元。");
          } else if (err.code === 'auth/unauthorized-domain') {
            setError(`網域未授權！請至 Firebase 控制台 > Authentication > 設定 > 授權網域，新增此網域：「${window.location.hostname}」`);
          } else {
            setError("發生錯誤：" + err.message);
          }
        } finally {
          setIsLoading(false);
        }
      };

      const handleGoogleAuth = async () => {
        setError(null);
        setIsLoading(true);
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (err) {
          if (err.code === 'auth/unauthorized-domain') {
            setError(`網域未授權！請至 Firebase 控制台 > Authentication > 設定 > 授權網域，新增此網域：「${window.location.hostname}」`);
          } else if (err.code !== 'auth/popup-closed-by-user') {
            setError("Google 登入失敗：" + err.message);

          setIsLoading(false);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CarbonApp />);
  </script>
</body>
